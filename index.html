<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Green Map - THCS Võ Trường Toản</title>
    <meta name="description" content="Khám phá và tìm hiểu hệ thống cây xanh trong khuôn viên trường thông qua bản đồ trực quan và mã QR." />
    <meta name="theme-color" content="#f4faf5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08130d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232e9e4f'><path d='M12 21c0-6 3-10 8-12-1 7-4 10-8 12z'/><path d='M12 21C9 16 5 14 2 14c2 5 6 7 10 7z'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap&subset=vietnamese" />
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      (function () {
        try {
          var t = localStorage.getItem("greenmap-theme") || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
